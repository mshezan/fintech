{% extends "base.html" %}

{% block title %}Login - FinTrack{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
        <div>
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-violet-600 to-blue-500 text-2xl shadow-lg">
                <span aria-hidden="true">💰</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
                Sign in to FinTrack
            </h2>
            <p class="mt-2 text-center text-sm text-zinc-500">
                Manage your finances with ease
            </p>
        </div>

        <form class="mt-8 space-y-6 rounded-2xl border border-white/[0.06] bg-[#1a1a1a] p-8 shadow-ft-card" action="{{ url_for('auth.login') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="mb-1 block text-sm font-medium text-zinc-400">Email address</label>
                    <input id="email" name="email" type="email" required
                           class="ft-input w-full bg-[#0f0f0f] px-4 py-3 placeholder:text-zinc-600"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-zinc-400">Password</label>
                    <input id="password" name="password" type="password" required
                           class="ft-input w-full bg-[#0f0f0f] px-4 py-3 placeholder:text-zinc-600"
                           placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                           class="h-4 w-4 rounded border-zinc-600 bg-[#0f0f0f] text-violet-600 focus:ring-violet-500/50">
                    <label for="remember" class="ml-2 block text-sm text-zinc-300">
                        Remember me
                    </label>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="ft-btn-primary w-full rounded-full py-3 text-sm font-semibold text-white shadow-ft-glow">
                    Sign in
                </button>
            </div>

            <div class="text-center">
                <p class="text-sm text-zinc-500">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="font-medium text-violet-400 hover:text-violet-300">
                        Register here
                    </a>
                </p>
            </div>

            <div class="rounded-xl border border-blue-500/20 bg-blue-500/10 p-3">
                <p class="text-center text-xs text-blue-200/90">
                    <strong>Demo:</strong> demo@fintrack.com / demo123
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
