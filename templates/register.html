{% extends "base.html" %}

{% block title %}Register - FinTrack{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
        <div>
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-violet-600 to-blue-500 text-2xl shadow-lg">
                <span aria-hidden="true">💰</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
                Create your account
            </h2>
            <p class="mt-2 text-center text-sm text-zinc-500">
                Start managing your finances today
            </p>
        </div>

        <form class="mt-8 space-y-6 rounded-2xl border border-white/[0.06] bg-[#1a1a1a] p-8 shadow-ft-card" action="{{ url_for('auth.register') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="mb-1 block text-sm font-medium text-zinc-400">Email address</label>
                    <input id="email" name="email" type="email" required
                           class="ft-input w-full bg-[#0f0f0f] px-4 py-3 placeholder:text-zinc-600"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-zinc-400">Password</label>
                    <input id="password" name="password" type="password" required
                           class="ft-input w-full bg-[#0f0f0f] px-4 py-3 placeholder:text-zinc-600"
                           placeholder="Minimum 6 characters">
                    <p class="mt-1 text-xs text-zinc-600">At least 6 characters</p>
                </div>
                <div>
                    <label for="confirm_password" class="mb-1 block text-sm font-medium text-zinc-400">Confirm Password</label>
                    <input id="confirm_password" name="confirm_password" type="password" required
                           class="ft-input w-full bg-[#0f0f0f] px-4 py-3 placeholder:text-zinc-600"
                           placeholder="Re-enter password">
                </div>
            </div>

            <div>
                <button type="submit"
                        class="ft-btn-primary w-full rounded-full py-3 text-sm font-semibold text-white shadow-ft-glow">
                    Create Account
                </button>
            </div>

            <div class="text-center">
                <p class="text-sm text-zinc-500">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="font-medium text-violet-400 hover:text-violet-300">
                        Sign in here
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
